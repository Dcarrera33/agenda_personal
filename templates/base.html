{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Mi agenda{% endblock %} · Agenda personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/estilos.css' %}" rel="stylesheet">
</head>
<body>
  {% if user.is_authenticated %}
  <nav class="navbar navbar-expand bg-body border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'tareas:lista' %}">Mi agenda</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'lista' %}active fw-semibold{% endif %}"
             href="{% url 'tareas:lista' %}">Tareas activas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'calendario' in request.resolver_match.url_name %}active fw-semibold{% endif %}"
             href="{% url 'tareas:calendario' %}">Calendario</a>
        </li>
      </ul>
      <form method="post" action="{% url 'logout' %}" class="d-flex">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-secondary">Salir</button>
      </form>
    </div>
  </nav>
  {% endif %}

  <main class="container pb-5">
    {% for mensaje in messages %}
      <div class="alert alert-{% if mensaje.tags == 'error' %}danger{% else %}{{ mensaje.tags }}{% endif %} alert-dismissible fade show">
        {{ mensaje }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}

    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
